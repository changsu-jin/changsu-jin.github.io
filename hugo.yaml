baseURL: "https://42class.com"
languageCode: "ko"
title: "42Class"
theme: "stack"

pagination:
  pagerSize: 10

params:
  mainSections:
    - posts
  description: "Developer who draws"
  favicon: /img/logo.png

  sidebar:
    emoji:
    subtitle: "Developer, DevOps, Doodle & Squash"
    avatar: "img/profile/avatar2.jpeg"

  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: "changsu-jin/changsu-jin.github.io"
      repoID: "MDEwOlJlcG9zaXRvcnkyODQyOTA1OTM="
      category: "General"
      categoryID: "DIC_kwDOEPHuIc4C6HnE"
      mapping: "pathname"
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: "top"
      theme: "preferred_color_scheme"
      lang: "ko"

  article:
    math: false
    toc: true
    readingTime: true

  colorScheme:
    toggle: true
    default: light

  widgets:
    homepage:
      - type: search
      - type: archives
      - type: categories
      - type: tag-cloud
    page:
      - type: toc

  footer:
    since: 2020

  defaultImage:
    opengraph:
      enabled: false

menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: About
      url: /about
      weight: 2
    - name: Development
      url: /dev
      weight: 3
    - name: Environment
      url: /env
      weight: 4
    - name: Archives
      url: /archives
      weight: 5
    - name: Categories
      url: /categories
      weight: 6

  social:
    - name: Meetnote
      url: https://github.com/changsu-jin/meetnote
      params:
        icon: brand-github
    - name: LinkedIn
      url: "https://www.linkedin.com/in/%EC%B0%BD%EC%88%98-%EC%A7%84-a4718333b/"
      params:
        icon: brand-linkedin
    - name: Email
      url: "mailto:changsu.jin@outlook.com"
      params:
        icon: messages

related:
  includeNewer: true
  threshold: 30
  indices:
    - name: categories
      weight: 200
    - name: tags
      weight: 100
    - name: date
      weight: 10

permalinks:
  posts: /:section/:slug/

markup:
  highlight:
    style: dracula
    lineNos: false
  goldmark:
    renderer:
      unsafe: true
